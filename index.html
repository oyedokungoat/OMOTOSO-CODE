<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Paws - Your Daily Dose of Pet News & Joy</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-firestore-compat.js"></script>
    
    <style>
        body { font-family: Arial, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 p-8">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-4">🔍 Firebase Debug Page</h1>
        
        <!-- Status -->
        <div id="status" class="bg-yellow-100 border border-yellow-400 p-4 rounded mb-4">
            ⏳ Checking Firebase connection...
        </div>
        
        <!-- Results -->
        <div id="results" class="bg-white shadow rounded p-6">
            <p class="text-gray-500">Loading data...</p>
        </div>
    </div>

    <script>
        // FIREBASE INIT
        const firebaseConfig = {
            apiKey: "AIzaSyDNVzufe491wFNjok66K5d-r_YQcZ9G3zg",
            authDomain: "happy-paw-8dea6.firebaseapp.com",
            projectId: "happy-paw-8dea6",
            storageBucket: "happy-paw-8dea6.appspot.com",
            messagingSenderId: "383324061970",
            appId: "1:383324061970:web:fbc89e595fb0ba337533cb"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        const statusDiv = document.getElementById('status');
        const resultsDiv = document.getElementById('results');
        
        statusDiv.innerHTML = '✅ Firebase initialized! Fetching data...';
        statusDiv.className = 'bg-blue-100 border border-blue-400 p-4 rounded mb-4';

        // TEST 1: Fetch ALL documents (ignore published filter)
        async function testFetch() {
            let html = '<h2 class="text-xl font-bold mb-4">📊 Test Results:</h2>';
            
            try {
                // Try fetching ALL blogposts without filters first
                const snapshot = await db.collection('blogposts').get();
                
                html += `<p class="mb-2"><strong>Collection "blogposts" found:</strong> ✅</p>`;
                html += `<p class="mb-2"><strong>Total documents:</strong> ${snapshot.size}</p>`;
                
                if (snapshot.empty) {
                    html += `<p class="text-red-600 font-bold">❌ No documents found in blogposts collection!</p>`;
                    html += `<p>Did you add documents to Firestore? Check the Firebase console.</p>`;
                } else {
                    html += `<hr class="my-4">`;
                    html += `<h3 class="font-bold mb-2">📝 Documents found:</h3>`;
                    
                    snapshot.forEach((doc, index) => {
                        const data = doc.data();
                        html += `
                            <div class="bg-gray-100 p-4 rounded mb-4">
                                <p><strong>Document ${index + 1} ID:</strong> ${doc.id}</p>
                                <p><strong>Fields found:</strong> ${Object.keys(data).join(', ')}</p>
                                <p><strong>Title:</strong> ${data.title || '❌ MISSING'}</p>
                                <p><strong>excerpt:</strong> ${data.excerpt || '❌ MISSING (check if you typed "except" instead)'}</p>
                                <p><strong>author:</strong> ${data.author || '❌ MISSING'}</p>
                                <p><strong>category:</strong> ${data.category || '❌ MISSING'}</p>
                                <p><strong>imageUrl:</strong> ${data.imageUrl ? '✅' : '❌ MISSING (check if you used "ImageUrl" with capital I)'}</p>
                                <p><strong>published:</strong> ${data.published === true ? '✅ true' : data.published === false ? '⚠️ false' : '❌ MISSING'}</p>
                                <p><strong>createdAt:</strong> ${data.createdAt ? '✅' : '❌ MISSING'}</p>
                            </div>
                        `;
                    });
                }
                
                statusDiv.innerHTML = '✅ Test complete!';
                statusDiv.className = 'bg-green-100 border border-green-400 p-4 rounded mb-4';
                
            } catch (err) {
                console.error('Error:', err);
                html += `<p class="text-red-600 font-bold">❌ Error: ${err.message}</p>`;
                html += `<p>Error code: ${err.code}</p>`;
                
                statusDiv.innerHTML = '❌ Error fetching data';
                statusDiv.className = 'bg-red-100 border border-red-400 p-4 rounded mb-4';
            }
            
            resultsDiv.innerHTML = html;
        }

        // Run test on page load
        testFetch();
    </script>
</body>
</html>
